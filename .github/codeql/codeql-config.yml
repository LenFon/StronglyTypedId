# CodeQL 配置文件。
#
# 为什么不写在 workflow 的 `with:` 里：`with:` 只接受标量映射，写成 YAML 序列会被 workflow 校验
# 拒掉（"A sequence was not expected"）；`paths-ignore` 也不是 codeql-action/init 的输入。
#
# 只分析 src / tools：test / bench / samples 不是攻击面，留在结果里只会稀释信号。workflow 里的
# Build 步骤同步只编译 src 与 tools。
name: "CodeQL config"

paths-ignore:
  - "test/**"
  - "bench/**"
  - "samples/**"

# 需要更宽的查询集时取消下面这行注释；默认查询集只报高置信度问题，误报最少。
# queries:
#   - security-extended
#   - security-and-quality
