# NuGet 已知漏洞巡检（含传递依赖）。
#
# 从 build-and-test.yml 搬出来的：那一步在每次 PR 上花 11s，非阻断、只写 job summary，平时没人看。
# 改成每周一次 + 手动触发，能力不减，PR 少等 11s。
#
# 不做成门禁：现存漏洞全落在 test / samples / bench 的传递依赖里，阻断会让 PR 因上游未发版而永久
# 变红。发布物那侧的完整依赖链由 common.props 的 NuGetAuditMode=all 在 restore 阶段报 NU1902/NU1903。

name: nuget audit

on:
  schedule:
    # 每周一 01:30 UTC = 北京时间 09:30。Dependabot 是 09:00，错开半小时免得同时抢 runner。
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Restore dependencies
      run: dotnet restore
    - name: NuGet vulnerability report
      # 只写 job summary，不设退出码：这份报告是给人看的，不是门禁。
      run: |
        {
          echo '### NuGet 已知漏洞（含传递依赖）'
          echo '```'
          dotnet package list --project Len.StronglyTypedId.slnx --vulnerable --include-transitive || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
