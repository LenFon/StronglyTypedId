# CodeQL 静态扫描。
#
# 路径过滤器必须用 `**` 递归匹配：源码全在 src/ test/ tools/ samples/ 下，原先写的 `"*.cs"` 只匹配
# 仓库根目录 —— 本工作流自建立起一次都没触发过（2026-10-19 修正）。
#
# 不用 autobuild：runner 预装的 SDK 未必含 net10.0，而本仓双目标 net8.0;net10.0，autobuild 会在
# 还原阶段失败。改为显式安装两个 SDK 后手动 build。
#
# 第三方 action 一律钉 40 位 commit sha（理由见 build-and-test.yml 顶部）；注释里的版本号供
# dependabot 的 github-actions 生态识别并提 SHA 升级 PR。
name: "CodeQL"

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.slnx"
      - "global.json"
      - ".github/workflows/codeql-analysis.yml"
  pull_request:
    # 下面的分支必须是上方分支的子集
    branches:
      - main
      - dev
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.slnx"
      - "global.json"
      - ".github/workflows/codeql-analysis.yml"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
      with:
        languages: ${{ matrix.language }}
        # 只报 src / tools 的告警：test / bench / samples 不是攻击面，留在结果里只会稀释信号。下面的
        # Build 也同步只编译 src 与 tools，两处口径一致。
        #
        # 过滤规则必须写在配置文件里：`with:` 只接受标量映射，写成 YAML 序列会被 workflow 校验拒绝，
        # 而且 `paths-ignore` 也不是 codeql-action/init 的输入。
        config-file: ./.github/codeql/codeql-config.yml

    # 顺序不可颠倒：CodeQL 的 C# 提取器挂在编译过程上，必须在 init 之后、analyze 之前完成构建。
    # restore 走全量：restore 不编译、代价小，且能让所有工程 assets 齐全，避免按工程 build 时撞
    # NETSDK1047（assets 里没有对应 TFM）。
    - name: Restore dependencies
      run: dotnet restore

    # 只编译 src 与 tools —— 也就是真正会被上报的那批代码。不直接 build 整个解决方案：test / bench /
    # samples 占了编译时间大头，而它们的告警已被 paths-ignore 滤掉；曾试过 `-p:TargetFrameworks=net10.0`
    # 收敛单目标，但该属性是全局的，src 主包被压成只剩 net10.0 后 samples 里 net8.0 的工程引用它会报
    # 「net10.0 的项目不能被 net8.0 的项目引用」。
    #
    # 逐个工程列出而不是 `dotnet build src`：src 下没有解决方案文件，MSBuild 不会递归查找。
    - name: Build
      run: |
        dotnet build src/Len.StronglyTypedId.Generators/Len.StronglyTypedId.Generators.csproj --no-restore
        dotnet build src/Len.StronglyTypedId/Len.StronglyTypedId.csproj --no-restore
        dotnet build src/Len.StronglyTypedId.Testing/Len.StronglyTypedId.Testing.csproj --no-restore
        dotnet build src/Len.StronglyTypedId.Testing.AutoFixture/Len.StronglyTypedId.Testing.AutoFixture.csproj --no-restore
        dotnet build tools/Len.StronglyTypedId.DocGen/Len.StronglyTypedId.DocGen.csproj --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
      with:
        category: "/language:${{matrix.language}}"
