# CodeQL 静态扫描。
#
# 路径过滤器必须用 `**` 递归匹配：本仓源码全在 src/ test/ tools/ samples/ 下，
# 原先写的 `"*.cs"` 只匹配仓库根目录 —— 本工作流自建立起一次都没触发过（2026-10-19 修正）。
#
# 不用 autobuild：runner 预装的 SDK 未必含 net10.0，而本仓双目标 net8.0;net10.0，
# autobuild 会在还原阶段失败。改为显式安装两个 SDK 后手动 build，与 build-and-test.yml 一致。
name: "CodeQL"

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.slnx"
      - "global.json"
      - ".github/workflows/codeql-analysis.yml"
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - main
      - dev
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.slnx"
      - "global.json"
      - ".github/workflows/codeql-analysis.yml"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # 需要更宽的查询集时在这里加 `queries: security-extended,security-and-quality`；
        # 默认查询集只报高置信度问题，误报最少。

    # 顺序不可颠倒：CodeQL 的 C# 提取器挂在编译过程上，必须在 init 之后、analyze 之前完成构建。
    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
