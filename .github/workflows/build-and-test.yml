# 构建 / 测试 / 覆盖率 / 打包校验 / AOT / 性能门槛。
#
# 五个 job 之间没有任何 needs。它们各跑在一台独立 VM 上、各 checkout、各 restore，谁也不消费谁的
# 产物 —— 加一条 needs 买不到复用，只会把关键路径从 build 的 6 分钟拉成 8 分钟。全部从 t=0 并行，
# 墙钟由最长的 build 决定。
#
# 触发面只覆盖「会改变产物或校验结论」的路径：源码、测试、基准、工具、构建配置、文档表格与工作流本身。

name: build and test

on:
  push:
    branches: [dev, main]
    paths: &changed-paths
      - "src/**"
      - "test/**"
      - "bench/**"
      - "tools/**"
      - "*.props"
      - "*.targets"
      - "*.slnx"
      - "global.json"
      - ".editorconfig"
      - "README*.md"
      - "PACKAGE.md"
      - "CHANGELOG*.md"
      - "codecov.yml"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [dev, main]
    paths: *changed-paths
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

# 本工作流只读仓库：不推代码、不发评论、不动 release。显式声明而不是沿用仓库默认值 ——
# 默认值可能是 write-all，任何一个第三方 action 被投毒都能借此改仓库。
permissions:
  contents: read

# 同一分支连推多次时旧运行已无意义：只对 PR 取消，push 到 dev/main 保留完整记录便于回溯。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v7
      with:
        # CHANGELOG 校验要把每个 tag 与版本小节对上，浅克隆读不到 tag。
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # 两个 TFM 的测试都要跑，显式安装两者，不依赖 runner 镜像预装的环境。
        dotnet-version: |
          8.0.x
          10.0.x
        # 五个 job 各跑在一台独立 VM 上，不缓存的话每台都要把整套依赖重下一遍。
        # 版本集中在 Directory.Packages.props（CPM），拿它当缓存键足够；仓库没有 lock 文件，
        # 键的粒度只能到「这份 props 变没变」，改任何版本都会整份失效 —— 宁可多失效，不会取到脏包。
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Verify generated README tables
      # 三张表由 DocGen 从生成器内部判定数据渲染，改了判定却没重新生成时这里直接红。
      run: dotnet run --project tools/Len.StronglyTypedId.DocGen --no-build -- --verify
    - name: Verify CHANGELOG
      # 每个 tag 必须有对应小节、日期与 tag 提交日期一致、文末链接不缺。
      run: dotnet run --project tools/Len.StronglyTypedId.DocGen --no-build -- --verify-changelog
    - name: Restore tools
      run: dotnet tool restore

    # 一次 dotnet test 跑完两个 TFM 的全部测试模块，只采一份覆盖率。
    #
    # 用 --test-modules 通配挑模块，而不是 --solution + --framework：后者会给每个测试工程解析模块
    # 路径，对不含该 TFM 的工程解析出不存在的 bin/Debug/<tfm>/<工程名>，启动时抛 Win32Exception 让
    # 整步失败。通配按「已构建产物」挑模块，没有该 TFM 产物的工程自然落选，也不必维护工程清单。
    # 注意 --test-modules 与 --solution / --project / --framework 互斥，只能裸跑。
    #
    # 通配写 *.Test.dll 而不是 *Test.dll：后者会把 Aot.SmokeTest 这种名字以 Test 结尾的非测试程序集
    # 也捞进来。包内容断言工程的程序集名刻意叫 Len.StronglyTypedId.Packaging.Tests（复数），同样不被
    # 选中 —— 它要真跑 dotnet pack，由独立的 packaging job 负责。
    #
    # 中间那段 * 同时匹配 net8.0 与 net10.0，九个模块交给 MTP 一次调度（内部并行）。以前是两条腿各跑
    # 一次、各采一份报告，但实测 net8.0 覆盖的源文件是 net10.0 的子集（94.65% vs 95.05%，并集仍是
    # 95.05%），分 TFM 的报告没带来额外信息，却要多付一次 dotnet-coverage 启动、一次上传和一次
    # Codecov 结算。
    #
    # 代价：glob 少匹配不会报错，只会静默少跑几个模块；动构建输出布局或测试工程集合时要回头核对。
    - name: Test + coverage
      run: |
        mkdir -p TestResults
        dotnet tool run dotnet-coverage -- collect -f cobertura \
          -o TestResults/coverage.cobertura.xml \
          dotnet test --test-modules "**/bin/Debug/*/*.Test.dll" --no-build --verbosity normal

    # fail_ci_if_error 必须为 true，否则覆盖率可以静默停更几个月而没人发现。
    # 统计范围与阈值在 codecov.yml（project 跌幅 ≤1%、patch ≥80%）；测试工程 / 工具 / 测试依赖由那边
    # 的 ignore 剔除 —— 采集阶段没法按路径过滤（--include-files 区分 / 与 \，跨 OS 不等价）。
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/coverage.cobertura.xml
        fail_ci_if_error: true

  # 包内容断言单独成 job：它内部要真跑 dotnet pack，不该拖慢 build 的测试腿，也不该把与 TFM 无关的
  # 用例混进覆盖率报告。
  #
  # 刻意不写 needs: build。五个 job 各 checkout、各 restore，谁也不消费谁的产物 —— 加一条 needs
  # 买不到任何东西，只会把关键路径从 build 的 6 分钟拉成 8 分钟。源码编译不过时它自己也会红，
  # 不需要 build 替它挡在前面。
  #
  # 不传 --framework：两个 TFM 的模块都会跑，夹具用跨进程文件锁串行化打包（先到者打包、后到者复用
  # 产物），因此 dotnet pack 只真正执行一次。
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Restore dependencies
      # 夹具内部用 dotnet pack --no-restore，src 工程必须先还原。
      run: dotnet restore
    - name: Verify package contents
      run: dotnet test --project test/Len.StronglyTypedId.Packaging.Test --verbosity normal

  # README / PACKAGE.md 宣称本库可在 Native AOT 与裁剪环境下工作，本 job 把它变成可验证的证据。
  #
  # 生成的 STJ 转换器内部仍走 JsonSerializer，而 AOT 下反射序列化被禁用 —— 宿主必须提供源生成的
  # JsonSerializerContext。这是 STJ 在 AOT 下的标准要求，不是本库的特例；冒烟工程里的
  # SmokeTestJsonContext 就是最小示例，同时也是「AOT 用户该怎么配」的活文档。
  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Install AOT toolchain
      # Native AOT 在 Linux 上需要 clang 与 zlib 开发包。
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: Publish (Native AOT)
      # 不传 --no-restore：ILCompiler 包由 PublishAot 的 targets 在还原阶段按 RID 引入。
      run: dotnet publish test/Len.StronglyTypedId.Aot.SmokeTest/Len.StronglyTypedId.Aot.SmokeTest.csproj -c Release -r linux-x64 -o artifacts/aot-smoke
    - name: Run smoke test
      run: ./artifacts/aot-smoke/Len.StronglyTypedId.Aot.SmokeTest

  # EnablePackageValidation 只在 dotnet pack 阶段生效：删成员 / 改签名 / 去掉目标框架 / 降低程序集版本
  # 都会在此直接报错，而不是等使用者升级后才发现。
  #
  # 版本号推导：version.props 的占位号（1.0.0）低于 ApiCompat 基线（1.3.0-preview.5），此时跨版本基线
  # 不会挂上，pack 退化为包内一致性校验。故复用发布流水线的 TagToVersion 从最近 tag 推导下一个版本号
  # 写回 version.props（≥ 基线 → 跨版本比对生效）；推导失败则兜底为基线号本身。
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
      with:
        # 需要 tag 才能让 TagToVersion 推导出正确的下一个版本号。
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Install dotnet tool
      run: dotnet tool install -g dotnetCampus.TagToVersion
    - name: Set version from latest tag (fall back to baseline)
      # CP0021 是「基线抑制」：只有当前 Version ≥ 基线时才会挂上 ApiCompat 基线做跨版本比对；
      # 占位号 1.0.0 低于基线，抑制会被判为「不必要」而直接 error。
      # 同时把 Assembly 版本号主段（major.minor.0.0）写进 env 供 build / pack 透传，
      # 让 CP0003「程序集版本应等于或高于基线」通过（基线 AssemblyVersion 是 1.3.0.0）。
      run: |
        set +e
        TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ -n "$TAG" ]; then
          dotnet TagToVersion -t "$TAG" -f version.props
        else
          echo "no tag reachable; using baseline version 1.3.0-preview.5"
          sed -i 's#<Version>.*</Version>#<Version>1.3.0-preview.5</Version>#' version.props
        fi
        PKG_VERSION=$(grep -oP '(?<=<Version>)[^<]+' version.props | head -n1)
        MAJOR=$(echo "$PKG_VERSION" | cut -d'.' -f1)
        MINOR=$(echo "$PKG_VERSION" | cut -d'.' -f2 | cut -d'-' -f1)
        ASM_VERSION="${MAJOR}.${MINOR}.0.0"
        echo "PackageVersion=${PKG_VERSION}  AssemblyVersion=${ASM_VERSION}"
        echo "ASSEMBLY_VERSION=${ASM_VERSION}" >> "$GITHUB_ENV"
    # restore 必须排在版本改写之后：ApiCompat 的基线包由 PackageDownload 声明，而
    # PackageValidationBaselineVersion 只在「Version ≥ 基线」时才挂上（见 common.props）。
    # 若先 restore，此刻版本还是占位号 1.0.0，基线包不进还原图也不落全局包目录，随后 Build 会因
    # 找不到 $(NuGetPackageRoot)/len.stronglytypedid/1.3.0-preview.5/…nupkg 抛 MSB4018
    # （本地因缓存里恰好留着该包而不复现）。与 publish-nuget.yml 的顺序保持一致。
    - name: Restore dependencies
      run: dotnet restore
    - name: Build (Release)
      run: dotnet build ./Len.StronglyTypedId.slnx -c Release --no-restore -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }}
    # 逐项目 pack 而不是 pack 整个解决方案：主包多 TFM 的 dll 收集在统一 OutputPath 下会撞 NU5026，
    # 逐项目 pack 用各自默认输出路径，两个 TFM 的 dll 各归其位。
    # 只有两个可发布项目（common.props 把 IsPackable 默认设为 false，仅主包与生成器包打开），
    # 因此上面的 Release build（GeneratePackageOnBuild）与这里的 pack 都只产出这两个包。
    - name: Pack (Release, with package validation)
      run: |
        dotnet pack ./src/Len.StronglyTypedId.Generators/Len.StronglyTypedId.Generators.csproj -c Release --no-restore -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }}
        dotnet pack ./src/Len.StronglyTypedId/Len.StronglyTypedId.csproj -c Release --no-restore -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }}

  # 生成器性能回归门槛。
  #
  # 不用 BenchmarkDotNet 做门禁：BDN 的价值在统计严谨，代价是单次几分钟；而 CI 跑在共享 runner 上，
  # 短作业墙钟抖动常超 ±20%，拿它做阻断式门槛只会制造假红。门槛改用固定轮次的确定性指标：分配字节数
  # 为主判据（同一路径逐字节可复现，Roslyn 侧的性能退化几乎都会体现在分配量上），耗时只作数量级兜底
  # （容忍 10 倍，用于捕捉「分配没变但复杂度炸了」）。放到 10 倍是因为墙钟跨机器不可比：实测同一份
  # 代码在开发机 13.97 ms、在 windows-latest 59.75 ms，相差 4.3 倍而分配量只差 0.011%。
  #
  # 钉在 windows-latest：基线在 Windows 上生成。引用程序集集合（尤其 Microsoft.AspNetCore.App 的
  # 引用程序集）与运行时补丁在不同 OS 上并不逐字节相同，分配量因此不可跨 OS 比对。
  # 有意改变性能特征时，本地跑 `--gate --update-baseline` 重写基线并连同改动一起提交。
  perf:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Restore dependencies
      # 只还原门槛要用的那条依赖链。整解决方案还原在 windows-latest 上实测 59s，而本 job 只用到
      # bench 两个工程（Consumer 由 Benchmarks 传递引用）—— 收窄后省下的时间比门槛本身（20s）还多。
      run: dotnet restore bench/Len.StronglyTypedId.Benchmarks/Len.StronglyTypedId.Benchmarks.csproj
    - name: Generator performance gate
      run: dotnet run -c Release --project bench/Len.StronglyTypedId.Benchmarks --no-restore -- --gate
