# 构建 / 测试 / 覆盖率 / 打包校验 / AOT / 性能门槛。
#
# 七个 job 之间没有 needs：各跑独立 VM、各 checkout、各 restore，不消费彼此产物，
# 加 needs 只会把关键路径从 build 的 6 分钟拉成 8 分钟。
#
# 触发面只覆盖会改变产物或校验结论的路径：源码、测试、基准、工具、构建配置、文档表格与工作流本身。
#
# 第三方 action 一律钉 40 位 commit sha，不用 @v7 这类可变 ref（上游可被重新指向，投毒即执行）。
# 注释里的版本号供 dependabot 的 github-actions 生态识别并提 SHA 升级 PR。
# 本文件与 publish-nuget.yml / codeql-analysis.yml / nuget-audit.yml 共用同一批 SHA，改一处要四处同步。

name: build and test

on:
  push:
    branches: [dev, main]
    paths: &changed-paths
      - "src/**"
      - "test/**"
      - "bench/**"
      - "tools/**"
      - "*.props"
      - "*.targets"
      - "*.slnx"
      - "global.json"
      - ".editorconfig"
      - "README*.md"
      - "PACKAGE.md"
      - "codecov.yml"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [dev, main]
    paths: *changed-paths
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

# 只读仓库：不推代码、不发评论、不动 release。显式声明而非沿用仓库默认值（可能是 write-all）。
permissions:
  contents: read

# 同一分支连推多次时旧运行已无意义：只对 PR 取消，push 到 dev/main 保留完整记录便于回溯。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        # 两个 TFM 的测试都要跑，显式安装两者，不依赖 runner 镜像预装。
        # 10.0.401 必须与 global.json 的 sdk.version 一致：两处不一致时 dotnet 找不到要求的 SDK
        # 直接失败（rollForward=latestPatch 不跨特性带）。升级 SDK 时两处同改。
        dotnet-version: |
          8.0.x
          10.0.401
        # 五个 job 各一台独立 VM，不缓存则每台都要重下整套依赖。
        # 版本集中在 Directory.Packages.props（CPM），拿它当缓存键；仓库无 lock 文件，改任何版本
        # 都会整份失效 —— 宁可多失效，不会取到脏包。
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Verify generated README tables
      # 三张表由 DocGen 从生成器内部判定数据渲染，改了判定却没重新生成时这里直接红。
      run: dotnet run --project tools/Len.StronglyTypedId.DocGen --no-build -- --verify
    - name: Verify PACKAGE.md
      # PACKAGE.md 是 NuGet 详情页正文，手写、发布后无法回滚。这里只校验三段纯枚举事实
      # （基元清单 / 集成标志 / 目标框架），散文措辞管不了。
      run: dotnet run --project tools/Len.StronglyTypedId.DocGen --no-build -- --verify-package-readme
    - name: Restore tools
      run: dotnet tool restore

    # 两条腿在同一 step 内后台并发，但各采一份报告、绝不合并：Actions 的 step 天然串行，想并行只能
    # 在一个 shell 里 `&` + `wait`；dotnet-coverage 一次 collect 只产出一个文件，所以并发的是两个
    # 采集会话。各自落到 coverage.net8/net10.cobertura.xml，由下面两个 upload step 分别带 flags 上传
    # —— 合并会丢掉「哪条腿漏了哪些行」（实测两条腿差 13 行，全在 UTF-8 TryParse 的发射路径上）。
    #
    # 用 --test-modules 通配挑模块，而不是 --solution + --framework：后者对不含该 TFM 的工程会解析出
    # 不存在的 bin/Debug/<tfm>/<工程名>，启动时抛 Win32Exception 让整步失败。通配按已构建产物挑模块，
    # 且与 --solution / --project / --framework 互斥，只能裸跑。
    #
    # 通配写 *.Test.dll 而非 *Test.dll：后者会捞进 Aot.SmokeTest；包内容断言工程的程序集名刻意叫
    # Packaging.Tests（复数），同样不被选中 —— 它要真跑 dotnet pack，由独立的 packaging job 负责。
    #
    # 退出码必须自己聚合：Actions 默认 `bash -e`，第一个 wait 非零就中止，第二条腿的报告采不到。
    #
    # 代价：glob 少匹配不报错，只会静默少跑几个模块；动构建输出布局时要回头核对。
    - name: Test + coverage (net8.0 + net10.0, in parallel)
      run: |
        mkdir -p TestResults
        # 先删旧报告：万一工作区里有残留，dotnet-coverage 可能往里追加，那就变成「合并」了。
        rm -f TestResults/coverage.net8.cobertura.xml TestResults/coverage.net10.cobertura.xml
        set +e
        dotnet tool run dotnet-coverage -- collect -f cobertura \
          -o TestResults/coverage.net8.cobertura.xml \
          dotnet test --test-modules "**/bin/Debug/net8.0/*.Test.dll" --no-build --verbosity normal \
          > TestResults/net8.log 2>&1 &
        pid8=$!
        dotnet tool run dotnet-coverage -- collect -f cobertura \
          -o TestResults/coverage.net10.cobertura.xml \
          dotnet test --test-modules "**/bin/Debug/net10.0/*.Test.dll" --no-build --verbosity normal \
          > TestResults/net10.log 2>&1 &
        pid10=$!
        wait $pid8; rc8=$?
        wait $pid10; rc10=$?
        cat TestResults/net8.log TestResults/net10.log
        # 两份报告必须都存在且非空。少一份就是「合并成一份」的前兆，宁可直接红。
        for f in TestResults/coverage.net8.cobertura.xml TestResults/coverage.net10.cobertura.xml; do
          if [ ! -s "$f" ]; then
            echo "::error::missing coverage report: $f"
            exit 1
          fi
        done
        if [ $rc8 -ne 0 ] || [ $rc10 -ne 0 ]; then
          echo "::error::net8.0 rc=$rc8, net10.0 rc=$rc10"
          exit 1
        fi

    # 每份报告单独上传、单独带一个 flag：一份报告挂多个 flag 会把整份覆盖率重复计入每个 flag。
    # fail_ci_if_error 必须为 true，否则覆盖率可以静默停更几个月。
    # 统计范围与阈值在 codecov.yml；测试工程 / 工具 / 测试依赖由那边的 ignore 剔除 ——
    # 采集阶段没法按路径过滤（--include-files 区分 / 与 \，跨 OS 不等价）。
    - name: Upload coverage (net8.0)
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/coverage.net8.cobertura.xml
        flags: net8.0
        fail_ci_if_error: true
    - name: Upload coverage (net10.0)
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/coverage.net10.cobertura.xml
        flags: net10.0
        fail_ci_if_error: true

  # 包内容断言单独成 job：它内部要真跑 dotnet pack，不该拖慢 build 的测试腿，也不该把与 TFM 无关的
  # 用例混进覆盖率报告。
  #
  # 刻意不写 needs: build（理由见文件头）。不传 --framework：两个 TFM 的模块都会跑，夹具用跨进程
  # 文件锁串行化打包（先到者打包、后到者复用产物），dotnet pack 只真正执行一次。
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.401
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Restore dependencies
      # 夹具内部用 dotnet pack --no-restore，src 工程必须先还原。
      run: dotnet restore
    - name: Verify package contents
      run: dotnet test --project test/Len.StronglyTypedId.Packaging.Test --verbosity normal

  # 生成器编译在 Roslyn 5.9 上，而分析器程序集引用的 Roslyn 版本必须 ≤ 宿主编译器版本，否则编译器
  # 报 CS9057 / CS8034 后静默丢弃生成器（用户看到的是「不包含 Create 的定义」）。包内因此放了两份
  # 产物：roslyn5.9 供 SDK 10.0.4xx，roslyn4.8 供 SDK 8 / 9 / 10.0.2xx。
  #
  # 本 job 用矩阵 SDK 消费真实 nupkg 来证明这件事。必须走包而不是 ProjectReference：
  # 目录选择（analyzers/dotnet/roslynX.Y/）只在包路径上发生，ProjectReference 复现不出来。
  #
  # 10.0.2xx 这一项专门守「目录名必须精确对应版本」：它是唯一能抓到「把 5.9 产物放进 roslyn5.0」
  # 这类错误的用例。
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: ["8.0.x", "9.0.x", "10.0.2xx"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        # 10.0.401 用来打包（仓库 global.json 要求），矩阵 SDK 用来构建探针。
        # 两者装在同一台机器上，靠探针目录下的 global.json 切换。
        dotnet-version: |
          10.0.401
          ${{ matrix.sdk }}
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Pack packages
      # 必须在仓库根跑（用 10.0.401）：探针目录下的 global.json 会把 SDK 切到矩阵版本，
      # 而仓库构建需要 10.0.401。
      #
      # 两个包都要打：主包依赖生成器包，探针装主包时会去本地源找它。
      #
      # 必须显式关掉 GeneratePackageOnBuild：common.props 在 Release 下把它设为 true，而 SDK 的
      # NuGet.Build.Tasks.Pack.targets 据此把 Build 从 GenerateNuspecDependsOn 里摘掉 —— 于是
      # `dotnet pack` 只打包、不构建。本 job 没有前置 build 步骤（pack 与 publish 两个 job 都有），
      # 生成器的 4.8 副构建产物因此不存在，AddRoslyn48AnalyzerToPackage 直接报错。关掉后 pack
      # 重新依赖 Build，两个工程（含副构建）都会先构建。Packaging.Test 的夹具出于同样原因也传了这个开关。
      run: |
        dotnet pack src/Len.StronglyTypedId.Generators/Len.StronglyTypedId.Generators.csproj -c Release -o artifacts/packages -p:GeneratePackageOnBuild=false
        dotnet pack src/Len.StronglyTypedId/Len.StronglyTypedId.csproj -c Release -o artifacts/packages -p:GeneratePackageOnBuild=false
    - name: Build compatibility probe
      # 在探针目录跑，让嵌套 global.json 生效。TreatWarningsAsErrors 已在 csproj 里，
      # CS9057 / CS8034 会直接失败而不是被当成噪音。
      working-directory: test/Len.StronglyTypedId.CompatibilityTest
      run: dotnet build -p:StronglyTypedIdVersion=${{ env.PACKAGE_VERSION }}
      env:
        PACKAGE_VERSION: 1.0.0

  # 集成版本矩阵：门控承诺的是「≥ 这个版本可用」，本 job 把这句话变成证据。
  #
  # 常规测试只钉一个版本（门控下界附近），上游改 API 时生成代码会在用户那里才炸。探针工程用
  # VersionOverride 换版本，编译通过 + 一次真实往返是判据。
  #
  # 只跑「下一个大版本」而不是全部历史版本：下界那一端已由 Integration.Test / GraphQL.Test /
  # Swagger.Test 各自钉住，矩阵的职责是上界。
  #
  # continue-on-error 首轮非阻塞：上游大版本刚发布时红项往往需要单独评估（是生成器要改，还是
  # 该版本确实不兼容）。绿了之后逐项去掉它转阻塞 —— 不允许「门控说支持、矩阵没跑过」的状态长期存在。
  integration-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # EF Core 10 只有 net10.0 资产，探针本身也是 net10.0。
          - name: efcore-10
            args: "-p:EfCoreVersion=10.0.13"
          - name: hotchocolate-15
            args: "-p:HotChocolateVersion=15.1.8"
          # Swashbuckle 10 依赖 Microsoft.OpenApi 2.x，与内置 OpenAPI 同侧，可以一起测。
          - name: swashbuckle-10
            args: "-p:SwashbuckleVersion=10.2.3 -p:IncludeAspNetCoreOpenApi=true -p:OpenApiVersion=10.0.13"
          # Swashbuckle 7 依赖 Microsoft.OpenApi 1.x，与内置 OpenAPI 互斥，故关掉后者。
          - name: swashbuckle-7
            args: "-p:SwashbuckleVersion=7.2.0"
          - name: messagepack-3
            args: "-p:MessagePackVersion=3.1.12"
          - name: mongodb-3
            args: "-p:MongoDbVersion=3.12.0"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: |
          10.0.401
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Build and run probe
      # 探针不参与解决方案构建，这里单独构建并运行它。TreatWarningsAsErrors 已在 csproj 里，
      # 生成器没跑（CS1929）或包不兼容（CS7069）都会直接失败。
      run: |
        dotnet run --project test/Len.StronglyTypedId.IntegrationMatrix/Len.StronglyTypedId.IntegrationMatrix.csproj -c Release ${{ matrix.args }}

  # README / PACKAGE.md 宣称本库可在 Native AOT 与裁剪环境下工作，本 job 把它变成可验证的证据。
  #
  # 生成的 STJ 转换器内部仍走 JsonSerializer，而 AOT 下反射序列化被禁用 —— 宿主必须提供源生成的
  # JsonSerializerContext。这是 STJ 的标准要求，不是本库特例；冒烟工程里的 SmokeTestJsonContext
  # 既是最小示例，也是「AOT 用户该怎么配」的活文档。
  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: |
          10.0.401
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Install AOT toolchain
      # Native AOT 在 Linux 上需要 clang 与 zlib 开发包。
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: Publish (Native AOT)
      # 不传 --no-restore：ILCompiler 包由 PublishAot 的 targets 在还原阶段按 RID 引入。
      run: dotnet publish test/Len.StronglyTypedId.Aot.SmokeTest/Len.StronglyTypedId.Aot.SmokeTest.csproj -c Release -r linux-x64 -o artifacts/aot-smoke
    - name: Run smoke test
      run: ./artifacts/aot-smoke/Len.StronglyTypedId.Aot.SmokeTest

  # EnablePackageValidation 只在 dotnet pack 阶段生效：删成员 / 改签名 / 去目标框架 / 降程序集版本
  # 都会在此直接报错，而不是等使用者升级后才发现。
  #
  # 版本号推导：version.props 的占位号（1.0.0）低于 ApiCompat 基线（1.3.0-preview.5），跨版本基线不会
  # 挂上，pack 退化为包内一致性校验。故复用 TagToVersion 从最近 tag 推导下一个版本号写回 version.props
  # （≥ 基线 → 跨版本比对生效）；推导失败则兜底为基线号本身。
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # 需要 tag 才能让 TagToVersion 推导出正确的下一个版本号。
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.401
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Install dotnet tool
      # 钉版本：不钉的话 TagToVersion 的行为变化会在某次 CI 里静默改变版本号推导结果。
      run: dotnet tool install -g dotnetCampus.TagToVersion --version 1.0.11
    - name: Set version from latest tag (fall back to baseline)
      # CP0021 是「基线抑制」：只有当前 Version ≥ 基线时才挂 ApiCompat 基线做跨版本比对；占位号 1.0.0
      # 低于基线，抑制会被判为「不必要」而直接 error。同时把 Assembly 版本主段（major.minor.0.0）写进
      # env 供 build / pack 透传，让 CP0003「程序集版本应等于或高于基线」通过（基线 AssemblyVersion 1.3.0.0）。
      run: |
        set +e
        TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ -n "$TAG" ]; then
          dotnet TagToVersion -t "$TAG" -f version.props
        else
          echo "no tag reachable; using baseline version 1.3.0-preview.5"
          sed -i 's#<Version>.*</Version>#<Version>1.3.0-preview.5</Version>#' version.props
        fi
        PKG_VERSION=$(grep -oP '(?<=<Version>)[^<]+' version.props | head -n1)
        MAJOR=$(echo "$PKG_VERSION" | cut -d'.' -f1)
        MINOR=$(echo "$PKG_VERSION" | cut -d'.' -f2 | cut -d'-' -f1)
        ASM_VERSION="${MAJOR}.${MINOR}.0.0"
        echo "PackageVersion=${PKG_VERSION}  AssemblyVersion=${ASM_VERSION}"
        echo "ASSEMBLY_VERSION=${ASM_VERSION}" >> "$GITHUB_ENV"
    # restore 必须排在版本改写之后：ApiCompat 的基线包由 PackageDownload 声明，而
    # PackageValidationBaselineVersion 只在 Version ≥ 基线时才挂上（见 common.props）。若先 restore，
    # 版本还是占位号，基线包不进还原图也不落全局包目录，随后 Build 会因找不到
    # $(NuGetPackageRoot)/len.stronglytypedid/1.3.0-preview.5/…nupkg 抛 MSB4018（本地因缓存里有该包不复现）。
    - name: Restore dependencies
      run: dotnet restore
    - name: Build (Release)
      run: dotnet build ./Len.StronglyTypedId.slnx -c Release --no-restore -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }}
    # 逐项目 pack 而不是 pack 整个解决方案：主包多 TFM 的 dll 收集在统一 OutputPath 下会撞 NU5026。
    - name: Pack (Release, with package validation)
      run: |
        dotnet pack ./src/Len.StronglyTypedId.Generators/Len.StronglyTypedId.Generators.csproj -c Release --no-restore -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }}
        dotnet pack ./src/Len.StronglyTypedId/Len.StronglyTypedId.csproj -c Release --no-restore -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }}
        dotnet pack ./src/Len.StronglyTypedId.Testing/Len.StronglyTypedId.Testing.csproj -c Release --no-restore -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }}
        dotnet pack ./src/Len.StronglyTypedId.Testing.AutoFixture/Len.StronglyTypedId.Testing.AutoFixture.csproj -c Release --no-restore -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }}
        dotnet pack ./src/Len.StronglyTypedId.Testing.Bogus/Len.StronglyTypedId.Testing.Bogus.csproj -c Release --no-restore -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} -p:FileVersion=${{ env.ASSEMBLY_VERSION }}

  # 生成器性能回归门槛。
  #
  # 不用 BenchmarkDotNet 做门禁：BDN 的价值在统计严谨，代价是单次几分钟；CI 跑在共享 runner 上，
  # 短作业墙钟抖动常超 ±20%，拿它做阻断只会制造假红。门槛改用固定轮次的确定性指标：分配字节数为
  # 主判据（同一路径逐字节可复现），耗时只作数量级兜底（容忍 10 倍，捕捉「分配没变但复杂度炸了」）——
  # 实测同一份代码开发机 13.97 ms、windows-latest 59.75 ms，相差 4.3 倍而分配量只差 0.011%。
  #
  # 钉在 windows-latest：基线在 Windows 上生成，引用程序集集合（尤其 Microsoft.AspNetCore.App）与
  # 运行时补丁在不同 OS 上并不逐字节相同，分配量不可跨 OS 比对。有意改变性能特征时本地跑
  # `--gate --update-baseline` 重写基线并连同改动一起提交。
  perf:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: |
          10.0.401
        cache: true
        cache-dependency-path: Directory.Packages.props
    - name: Restore dependencies
      # 只还原门槛要用的那条依赖链：整解决方案还原在 windows-latest 上实测 59s，而本 job 只用到
      # bench 两个工程（Consumer 由 Benchmarks 传递引用）—— 收窄后省下的时间比门槛本身（20s）还多。
      run: dotnet restore bench/Len.StronglyTypedId.Benchmarks/Len.StronglyTypedId.Benchmarks.csproj
    - name: Generator performance gate
      run: dotnet run -c Release --project bench/Len.StronglyTypedId.Benchmarks --no-restore -- --gate
