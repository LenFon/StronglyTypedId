# 发布到 nuget.org：tag 触发 → 校验版本号 → 打包 → OIDC 换短期密钥 → 推包与符号包。

name: publish nuget

# 只有形如 1.2.3 / v1.2.3 / 1.2.3-beta.1 的 tag 才触发发布：原先写 '*' 时任何 tag（test、
# release-notes、1.0.0-rc）都会走完整发布流程，而 nuget.org 的版本号不可回收 —— 推错只能 unlist。
#
# 这里只粗筛「以数字开头」或「v + 数字开头」：Actions filter pattern 里 '*' 的语义在两处官方表述
# 下不一致，写细了可能连 1.2.3-beta.1 都匹配不上，而那种失败是静默的。精度交给第一步的正则校验。
on:
  push:
    tags:
    - 'v[0-9]*'
    - '[0-9]*'

permissions:
  contents: read
  id-token: write   # 启用 GitHub OIDC 令牌签发，供 NuGet 受信任发布交换短期 API 密钥

jobs:
  build:

    runs-on: ubuntu-latest

    # 人工闸门：仓库 Settings → Environments 里建名为 nuget 的环境并配 required reviewers，发布就必须
    # 有人点同意。环境不存在时 GitHub 会自动创建且不带保护规则（job 照常跑），故这行不会让流程变红。
    environment: nuget

    steps:
    # tag 名是唯一的外部输入，也是唯一能决定「往 nuget.org 推什么版本号」的东西。触发器只做了粗筛，
    # 这里补一道严格判定，放在 checkout 之前：不合法就在克隆仓库前红，2 秒出结果，不留副作用。
    - name: Validate tag format
      env:
        # 走 env 中转，绝不把 ${{ }} 直接拼进 run: —— Actions 在交给 shell 之前就做文本替换，而 tag 名
        # 允许包含 $ ( ) ; | & 等字符，名为 '1.0.0$(curl ... | sh)' 的 tag 会被求值执行。
        TAG_NAME: ${{ github.ref_name }}
      run: |
        set -eu
        if ! printf '%s' "$TAG_NAME" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
          echo "::error::tag '$TAG_NAME' 不是合法的发布版本号（期望 1.2.3 / v1.2.3 / 1.2.3-beta.1）"
          exit 1
        fi

    # 第三方 action 一律钉 40 位 commit sha（理由见 build-and-test.yml 顶部）。本 job 同时持有
    # id-token: write、NUGET_USER 与 nupkg 推送权，投毒的 action 能直接发布一个带后门的包。
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install dotnet tool
      # 钉版本：不钉的话 TagToVersion 的行为变化会在某次发布时静默改变版本号推导结果。
      run: dotnet tool install -g dotnetCampus.TagToVersion --version 1.0.11
    - name: Set tag to version
      # 同时把 Assembly 版本主段（major.minor.0.0）写入 env 供 build/pack 透传：dotnet pack 的 ApiCompat
      # 校验（CP0003）要求 AssemblyVersion ≥ 基线 1.3.0.0，否则 tag 发布挂上基线后会直接报 CP0003。
      env:
        GIT_REF: ${{ github.ref }}
      run: |
        set -eu
        dotnet TagToVersion -t "$GIT_REF" -f version.props
        PKG_VERSION=$(grep -oP '(?<=<Version>)[^<]+' version.props | head -n1)
        # 推导失败时 TagToVersion 会落到兜底版本号 —— 那是真实存在的版本，推上去收不回来。
        # 所以推导结果必须再过一遍形状校验，不能只信上一步的 tag 校验。
        if ! printf '%s' "$PKG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
          echo "::error::version.props 推导出的版本号 '$PKG_VERSION' 不合法，已中止发布"
          exit 1
        fi
        MAJOR=$(echo "$PKG_VERSION" | cut -d'.' -f1)
        MINOR=$(echo "$PKG_VERSION" | cut -d'.' -f2 | cut -d'-' -f1)
        ASM_VERSION="${MAJOR}.${MINOR}.0.0"
        echo "PackageVersion=${PKG_VERSION}  AssemblyVersion=${ASM_VERSION}"
        echo "ASSEMBLY_VERSION=${ASM_VERSION}" >> "$GITHUB_ENV"
        echo "PACKAGE_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        # net8.0 与 net10.0 都要打包，显式安装两者 SDK，与 build-and-test.yml 一致。
        # 10.0.401 必须与 global.json 的 sdk.version 一致，否则 dotnet 找不到要求的 SDK 直接失败
        # （rollForward=latestPatch 不跨特性带）。升级时两处同改。
        dotnet-version: |
          8.0.x
          10.0.401
    - name: Restore dependencies
      run: dotnet restore ./Len.StronglyTypedId.slnx
    # 构建与打包分两步，且不使用统一 OutputPath：原先的 `--property:OutputPath=../../bin/Release/`
    # 配合 Release 下打开的 GeneratePackageOnBuild，正是 build-and-test.yml 判定会撞 NU5026 的组合
    # （多 TFM 的 dll 收集到同一目录）。当前两个 TFM 的 dll 文件名不同，侥幸没撞；一旦加第三个 TFM 或
    # 调整 TargetsForTfmSpecificBuildOutput，就会在打 tag 那一刻炸 —— 而那时版本号已经推出去了。
    #
    # 版本号一律走 shell 变量（$ASSEMBLY_VERSION）而不是 ${{ env.ASSEMBLY_VERSION }}：后者同样是交给
    # shell 之前的文本替换，没有理由在发布链路上留第二处可插值的位置。
    - name: Build
      run: dotnet build ./Len.StronglyTypedId.slnx -c Release --no-restore -p:GeneratePackageOnBuild=false -p:AssemblyVersion=$ASSEMBLY_VERSION -p:FileVersion=$ASSEMBLY_VERSION

    # 逐项目 pack：每个工程用默认输出路径收集 dll，两个 TFM 各归其位。生成器包在前 —— 主包的
    # InjectGeneratorsPackageDependency 只写 nuspec 依赖条目、不读生成器包本体，但与 build-and-test.yml
    # 保持同序以减少差异面。PackageOutputPath 指到 bin/Release：下面两步都按这个目录找包。
    - name: Pack
      run: |
        set -eu
        OUT="$PWD/bin/Release"
        dotnet pack ./src/Len.StronglyTypedId.Generators/Len.StronglyTypedId.Generators.csproj -c Release --no-restore -p:PackageOutputPath="$OUT" -p:AssemblyVersion=$ASSEMBLY_VERSION -p:FileVersion=$ASSEMBLY_VERSION
        dotnet pack ./src/Len.StronglyTypedId/Len.StronglyTypedId.csproj -c Release --no-restore -p:PackageOutputPath="$OUT" -p:AssemblyVersion=$ASSEMBLY_VERSION -p:FileVersion=$ASSEMBLY_VERSION
        dotnet pack ./src/Len.StronglyTypedId.Testing/Len.StronglyTypedId.Testing.csproj -c Release --no-restore -p:PackageOutputPath="$OUT" -p:AssemblyVersion=$ASSEMBLY_VERSION -p:FileVersion=$ASSEMBLY_VERSION
        dotnet pack ./src/Len.StronglyTypedId.Testing.AutoFixture/Len.StronglyTypedId.Testing.AutoFixture.csproj -c Release --no-restore -p:PackageOutputPath="$OUT" -p:AssemblyVersion=$ASSEMBLY_VERSION -p:FileVersion=$ASSEMBLY_VERSION
        dotnet pack ./src/Len.StronglyTypedId.Testing.Bogus/Len.StronglyTypedId.Testing.Bogus.csproj -c Release --no-restore -p:PackageOutputPath="$OUT" -p:AssemblyVersion=$ASSEMBLY_VERSION -p:FileVersion=$ASSEMBLY_VERSION

    # 发布目录里只允许出现这五个包。多一个少一个都会在换取 API 密钥之前中止发布。
    - name: Verify packaged set
      run: |
        set -eu
        expected=$(printf '%s\n' \
          "Len.StronglyTypedId.${PACKAGE_VERSION}.nupkg" \
          "Len.StronglyTypedId.Generators.${PACKAGE_VERSION}.nupkg" \
          "Len.StronglyTypedId.Testing.${PACKAGE_VERSION}.nupkg" \
          "Len.StronglyTypedId.Testing.AutoFixture.${PACKAGE_VERSION}.nupkg" \
          "Len.StronglyTypedId.Testing.Bogus.${PACKAGE_VERSION}.nupkg" | sort)
        actual=$(find bin/Release -maxdepth 1 -name '*.nupkg' -printf '%f\n' | sort)
        if [ "$actual" != "$expected" ]; then
          echo "::error::bin/Release 下的包与预期不符，已中止发布"
          printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual"
          exit 1
        fi
        printf 'OK: %s\n' "$(echo "$actual" | tr '\n' ' ')"

    # 通过 OIDC 向 nuget.org 换取短期 API 密钥（无需存储长期密钥）。私有仓库首次创建受信任发布策略后
    # 进入「待完全激活」状态，只有 7 天激活窗口；窗口内成功发布一次即永久激活，否则自动失效（可重启）。
    - name: NuGet login (OIDC → 临时 API 密钥)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}  # nuget.org 用户名（配置文件名），不是邮箱

    # --skip-duplicate：重跑同一 tag 时主包已存在会让 nuget.org 返回 409，该选项把 409 降级为警告，
    # 使发布步骤幂等。密钥走 env 而不是拼进命令行：OIDC 换来的短期密钥不是注册过的 secret，Actions
    # 不会自动打码，拼在命令行上有被日志回显的风险。
    - name: Publish the package to nuget.org
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push bin/Release/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    # 符号包必须单独再推一次：通配符 *.nupkg 不匹配 *.snupkg。顺序上必须在主包之后 —— nuget.org
    # 要求符号包对应的包已存在。--skip-duplicate 把「已有待验证副本」的 409 降级为警告。
    - name: Publish the symbol package to nuget.org
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push bin/Release/*.snupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
