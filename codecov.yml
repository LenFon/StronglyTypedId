# Codecov 配置。放在仓库根，Codecov 自动读取。
#
# 覆盖率报告由 dotnet-coverage 采集，混着大量「跑测试用的代码」：测试工程自身、DocGen 工具，以及
# Dapper / Microsoft.CodeAnalysis.Testing 这些测试依赖。它们把总覆盖率稀释到 40% 左右（实测
# 6207/15491 行），于是「跌 1%」这种阈值永远不会被触发 —— 门槛形同虚设。
#
# 所以先用 ignore 剔出去，只留真正发布到 nuget.org 的五个包（src/ 下的全部工程）。覆盖率应该衡量
# 「发出去的东西」。
#
# 剔除后本机实测（2026-10-21，合并单报告口径，35 个文件 / 3919 行）：95.00%。拆开看：主包 18/21
# （85.71%）、生成器包 3705/3898（95.05%）。主包行数极少，一个未覆盖分支就能拉动 4 个百分点，
# 看趋势时以生成器包为准。
#
# CI 按 TFM 分两条腿、各采一份报告、各带一个 flag（net8.0 / net10.0）上传，见 build-and-test.yml：
# 一份报告挂多个 flag 会把整份覆盖率重复计入每个 flag，所以必须「一条腿一份文件一个 flag」。
# 合并后的整体覆盖率由 Codecov 按 flag 求并集。（旧注释的 96.83% / 3056 行是 2026-10-19 口径。）

coverage:
  precision: 2
  round: down
  range: "90...100"

  status:
    # 整体覆盖率：与目标分支比较，允许 1% 自然波动，不设绝对下限（95% 这类下限在重构、删代码、
    # 拆文件时会制造无意义的红）。
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
        informational: false

    # 新增/改动行：要求 80%，允许 5% 欠账。这条才是真正拦住「新代码没测试」的门槛。
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: false

comment:
  # flags 段列出每个 flag 各自的覆盖率与行数，PR 里一眼能看出两条腿的差异。
  layout: "reach,diff,flags,files"
  behavior: default
  # 覆盖率没变化就不发评论，避免每个 PR 都刷一条「0% 变化」。
  require_changes: true

# 两条腿并发跑但两份报告先后上传。不设这个值，Codecov 收到第一份就结算并评论，第二条腿的数字
# 永远晚一步补上（表现为整体覆盖率偏低、状态检查闪一下又变）。
notify:
  after_n_builds: 2

# 只统计真正发布出去的五个包。测试工程与工具自身的行数比产品代码还多，算进去只会掩盖真实趋势。
ignore:
  - "test/**"
  - "tools/**"
  - "samples/**"
  - "bench/**"
  # 下面两条是保险：这两个依赖的源码路径来自嵌入 PDB 的虚拟路径（`/_/Dapper/...`），Codecov 通常
  # 无法映射回仓库而自动丢弃；显式写上，免得映射规则变了又被算进来。
  - "**/Dapper/**"
  - "**/Microsoft.CodeAnalysis.Testing/**"
