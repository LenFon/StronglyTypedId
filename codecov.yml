# Codecov 配置。放在仓库根，Codecov 自动读取。
#
# 覆盖率报告由 dotnet-coverage 采集，里面混着大量「跑测试用的代码」：测试工程自身、DocGen 工具，
# 以及 Dapper / Microsoft.CodeAnalysis.Testing 这些测试依赖。它们把总覆盖率稀释到 40% 左右
# （实测 6207/15491 行），于是「跌 1%」这种阈值永远不会被触发 —— 门槛形同虚设。
#
# 所以先用 ignore 把它们剔出去，只留四个随包发布的程序集：
#   Len.StronglyTypedId / .Generators / .Testing / .Testing.AutoFixture
# 剔除后本机实测（2026-10-21，42 个文件 / 4064 行）：net8.0 单腿 94.65%、net10.0 单腿 95.05%、
# 两者并集 95.05%。net8.0 腿只跑三个测试工程（Test / Integration.Test / Generators.Test），
# 是 net10.0 的子集，所以并集与 net10.0 单腿一致 —— 两个 flag 的价值在于能按 TFM 单独查看，
# 以及将来出现 `#if NET8_0` 之类的分支时能立刻看出两条腿的差异。
# （旧注释里的 96.83% / 3056 行是 2026-10-19 的口径，代码此后增长，已不适用。）

# 两份报告（net8.0 / net10.0）在同一个 job 里先后上传。不声明等待数的话，Codecov 收到第一份就
# 开始算状态、发评论 —— 那一刻只有 net8.0 的数据（实测 94.65% vs 合并后 95.05%），评论里的数字会
# 短暂偏低。after_n_builds 让它等齐两份再算。
# 代价：某条腿没上传成功时不会有评论/状态 —— 但那种情况下 job 本身就是红的（fail_ci_if_error）。
codecov:
  notify:
    after_n_builds: 2

coverage:
  precision: 2
  round: down
  range: "90...100"

  status:
    # 整体覆盖率：与目标分支比较，允许 1% 的自然波动，不设绝对下限。
    # 绝对下限（比如 95%）在重构、删代码、拆文件时会制造无意义的红。
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
        informational: false

    # 新增/改动行：要求 80%，允许 5% 欠账。这条才是真正拦住「新代码没测试」的门槛。
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: false

# 两条测试腿（net8.0 / net10.0）各自采集并上传一份报告，用 flag 区分，便于在 Codecov 上按 TFM
# 分别查看。两者覆盖的是同一批源文件（同一份代码的两个 TFM 构建），因此**不设 paths** —— 设了会把
# 对方的文件排除在外，反而割裂统计。
#
# carryforward：某次提交只跑了一条腿（例如另一条腿失败）时，缺失的 flag 沿用上一次的结果，而不是
# 让 project 状态因为「报告不全」直接判红。
flag_management:
  default_rules:
    carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  # 覆盖率没变化就不发评论，避免每个 PR 都刷一条「0% 变化」。
  require_changes: true

# 只统计随包发布的程序集。测试工程与工具自身的行数比产品代码还多，算进去只会掩盖真实趋势。
ignore:
  - "test/**"
  - "tools/**"
  - "samples/**"
  - "bench/**"
  # 下面两条是保险：这两个依赖的源码路径来自嵌入 PDB 的虚拟路径（`/_/Dapper/...`），
  # Codecov 通常无法映射回仓库而自动丢弃；显式写上，免得哪天映射规则变了又被算进来。
  - "**/Dapper/**"
  - "**/Microsoft.CodeAnalysis.Testing/**"
